spring:
  application:
    name: shipcore-backend

  datasource:
    url: jdbc:mysql://localhost:3306/shipcore_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
    username: root
    password: ${DB_PASSWORD:190706}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    baseline-on-migrate: true
    validate-on-migrate: false


jwt:
  secret: U2hpcENvcmUyMDI2U3VwZXJTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24xMjM0NTY3ODkw
  expiration: 86400000

server:
  port: 8080
